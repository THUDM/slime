name: Release Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "README_zh.md"
  workflow_dispatch:

concurrency:
  group: release-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'THUDM/slime'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate experiment generator
        run: node --test docs/tests/experiment.test.cjs
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pip install -r docs/requirements.txt
      - name: Build documentation
        run: |
          cd docs
          bash ./build.sh en -W --keep-going
          bash ./build.sh zh -W --keep-going
          mv ./build/zh ./build/en/
        env:
          LC_ALL: "en_US.UTF-8"
          LC_CTYPE: "en_US.UTF-8"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/en
